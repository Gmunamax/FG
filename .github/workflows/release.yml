name: Create a new release

on:
  push:
    tags:
      - 'v\d*.\d*.\d*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout main project
        uses: actions/checkout@v4
        with:
          path: FG
          submodules: 'true'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libglm-dev libboost-test-dev cppcheck zip patchelf

      - name: Install SDL3
        uses: libsdl-org/setup-sdl@v1
        with:
          version: 3.4.0
          build-type: "Release"

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability --std=c++26 FG

      - name: Configure and Build FG
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake FG -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build --config Release

      - name: Package Artifacts
        run: |
          mkdir -p release
          cp build/FG release/
          cp build/deps/FGengine/libFGengine.so release/ 
          patchelf --set-rpath '$ORIGIN' release/FG
          zip -r FG-linux-v${{ github.ref_name }}.zip release

      - name: Prepare Release
        id: prepare_release
        env:
          PROJECT_NAME: FGengine
          VERSION: ${{ github.ref_name }}
        run: |
          # Remove patch version if it is 0 and letter 'v'
          VERSION=${VERSION#v}
          if [[ "$VERSION" == *.0 ]]; then
            VERSION=${VERSION%.0}
          fi
          RELEASE_TITLE="$PROJECT_NAME $VERSION"
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT

          # Get release changelog from tag message
          cd FGengine
          TAG_BODY=$(git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' refs/tags/${{ github.ref_name }})
          cd ..
          echo "release_message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Tag and Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.prepare_release.outputs.release_title }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.prepare_release.outputs.release_message }}
          prerelease: true
          files: |
            FG-linux-v${{ github.ref_name }}.zip
